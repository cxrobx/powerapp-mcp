[project]
name = "powerapp-mcp"
version = "0.1.0"
description = "MCP server for generating Power Apps .msapp files from natural language"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
